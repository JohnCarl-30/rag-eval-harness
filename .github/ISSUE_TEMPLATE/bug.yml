name: Bug report
description: Something is broken in rag-eval-harness
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. This project evaluates RAG pipelines; it is not a RAG framework.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: CLI command, evaluator (stub/ragas), sample row (redact secrets), and versions.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.1.0"
