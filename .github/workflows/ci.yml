name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --frozen --group dev --extra agent
      - name: Ruff
        run: uv run ruff check src tests
      - name: Pytest
        run: uv run pytest -q
      - name: Nimbus gate stays red
        run: ./scripts/demo.sh
      - name: Baseline for the consumer action
        run: uv run rag-eval eval examples/dummy-rag/traces.jsonl --evaluator lexical -o "$RUNNER_TEMP/baseline.json"
      - name: Consumer action (lexical gate, report, PR comment)
        id: consumer
        uses: ./
        with:
          package: .
          traces: examples/dummy-rag/traces.jsonl
          evaluator: lexical
          baseline: ${{ runner.temp }}/baseline.json
          output: rag-eval-results.json
          comment: "true"
      - name: Consumer action reported a pass
        run: test "${{ steps.consumer.outputs.passed }}" = "true" && test -s "${{ steps.consumer.outputs.report }}"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose smoke
        env:
          RAG_EVAL_API_KEY: ci-smoke-key
        run: |
          docker compose up --build -d
          bash scripts/smoke.sh
          docker compose down -v
