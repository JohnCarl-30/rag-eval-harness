name: rag-eval
description: Evaluate RAG traces or an HTTP SUT and fail if mean metrics regress vs a baseline
author: rag-eval-harness

inputs:
  traces:
    description: Precomputed traces file (CSV/JSONL/JSON)
    required: false
  dataset:
    description: Golden dataset file (use with sut-url)
    required: false
  sut-url:
    description: HTTP SUT URL accepting POST {"question"}
    required: false
  sut-token:
    description: Optional bearer token for the SUT
    required: false
  evaluator:
    description: stub, lexical, or ragas
    required: false
    default: stub
  baseline:
    description: Baseline run id or JSON file containing means
    required: false
  threshold:
    description: Fail if any mean drops by more than this
    required: false
    default: "0.05"
  output:
    description: Path to write the head JSON snapshot
    required: false
    default: rag-eval-results.json
  database-url:
    description: SQLAlchemy URL
    required: false
  openai-api-key:
    description: Judge key for the ragas evaluator
    required: false
  openai-base-url:
    description: Optional OpenAI-compatible base URL
    required: false
  package:
    description: Install target (rag-eval-harness or . for this repo)
    required: false
    default: rag-eval-harness
  extra:
    description: Extra to append, e.g. [ragas]
    required: false
    default: ""
  python-version:
    description: Python version
    required: false
    default: "3.12"
  label:
    description: Optional run label
    required: false
    default: ""
  investigate:
    description: '"true" to run rag-eval investigate on a failed gate (installs the agent extra; needs a model key)'
    required: false
    default: "false"
  agent-model:
    description: Pydantic AI model string for investigate, e.g. anthropic:claude-sonnet-5 (default openai-chat:$OPENAI_MODEL)
    required: false
    default: ""
  anthropic-api-key:
    description: Key for anthropic:* agent models
    required: false
  comment:
    description: '"true" to post the report as one PR comment, updated on each push (needs pull-requests: write)'
    required: false
    default: "false"
  github-token:
    description: Token for the PR comment
    required: false
    default: ${{ github.token }}

outputs:
  passed:
    description: '"true" when the gate passed'
    value: ${{ steps.gate.outputs.passed }}
  report:
    description: Path to the Markdown report
    value: ${{ steps.gate.outputs.report }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install rag-eval-harness
      shell: bash
      run: |
        python -m pip install --upgrade pip
        EXTRA="${{ inputs.extra }}"
        if [[ "${{ inputs.investigate }}" == "true" && -z "$EXTRA" ]]; then
          EXTRA="[agent]"
        fi
        python -m pip install "${{ inputs.package }}${EXTRA}"
    - name: Evaluate
      shell: bash
      env:
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        OPENAI_BASE_URL: ${{ inputs.openai-base-url }}
      run: |
        set -euo pipefail
        if [[ -n "${{ inputs.database-url }}" ]]; then
          export DATABASE_URL="${{ inputs.database-url }}"
        fi
        SOURCE="${{ inputs.traces }}"
        if [[ -n "${{ inputs.dataset }}" ]]; then
          SOURCE="${{ inputs.dataset }}"
        fi
        if [[ -z "$SOURCE" ]]; then
          echo "Provide traces or dataset" >&2
          exit 2
        fi
        ARGS=(eval "$SOURCE" --evaluator "${{ inputs.evaluator }}" --output "${{ inputs.output }}")
        if [[ -n "${{ inputs.sut-url }}" ]]; then
          ARGS+=(--sut-url "${{ inputs.sut-url }}")
        fi
        if [[ -n "${{ inputs.sut-token }}" ]]; then
          ARGS+=(--sut-token "${{ inputs.sut-token }}")
        fi
        if [[ -n "${{ inputs.label }}" ]]; then
          ARGS+=(--label "${{ inputs.label }}")
        fi
        if [[ -n "${{ github.sha }}" ]]; then
          ARGS+=(--git-sha "${{ github.sha }}")
        fi
        rag-eval "${ARGS[@]}"
    - name: Regress vs baseline
      id: gate
      if: ${{ inputs.baseline != '' }}
      shell: bash
      env:
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        OPENAI_BASE_URL: ${{ inputs.openai-base-url }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        RAG_EVAL_AGENT_MODEL: ${{ inputs.agent-model }}
      run: |
        set -uo pipefail
        if [[ -n "${{ inputs.database-url }}" ]]; then
          export DATABASE_URL="${{ inputs.database-url }}"
        fi
        REPORT="$RUNNER_TEMP/rag-eval-report.md"
        COMMAND=regress
        if [[ "${{ inputs.investigate }}" == "true" ]]; then
          COMMAND=investigate
        fi
        rag-eval "$COMMAND" \
          --baseline "${{ inputs.baseline }}" \
          --head "${{ inputs.output }}" \
          --threshold "${{ inputs.threshold }}" \
          --report "$REPORT"
        STATUS=$?
        if [[ -f "$REPORT" ]]; then
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
        fi
        echo "report=$REPORT" >> "$GITHUB_OUTPUT"
        echo "status=$STATUS" >> "$GITHUB_OUTPUT"
        if [[ "$STATUS" == "0" ]]; then echo "passed=true"; else echo "passed=false"; fi >> "$GITHUB_OUTPUT"
    - name: Comment on the pull request
      if: ${{ inputs.baseline != '' && inputs.comment == 'true' && github.event.pull_request.number }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        REPORT: ${{ steps.gate.outputs.report }}
      run: |
        set -uo pipefail
        [[ -f "$REPORT" ]] || exit 0
        MARKER="<!-- rag-eval-harness -->"
        BODY="$(printf '%s\n%s' "$MARKER" "$(cat "$REPORT")")"
        EXISTING="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
          --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -n 1)"
        if [[ -n "$EXISTING" ]]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$EXISTING" -f body="$BODY" >/dev/null
        else
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$BODY" >/dev/null
        fi || echo "::warning::rag-eval could not comment on the PR (fork PRs get a read-only token)."
    - name: Fail on regression
      if: ${{ inputs.baseline != '' }}
      shell: bash
      run: exit "${{ steps.gate.outputs.status }}"
